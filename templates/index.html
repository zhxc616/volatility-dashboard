<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        :root {
            --bg-app: #000000;
            --bg-card: #121212;
            --brand-primary: #FFFFFF;
            --text-secondary: #A0A0A0;
            --brand-accent: #00B4F0;
            --finance-red: #FF3B30;
            --border-color: #2C2C2C;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-app);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--brand-primary);
        }
        .container {
            background-color: var(--bg-card);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 850px;
            text-align: center;
        }
        h1 { margin-bottom: 8px; font-weight: 800; letter-spacing: -0.5px; }
        p.subtitle { color: var(--text-secondary); margin-bottom: 40px; font-weight: 500; }
        .highlight-blue { color: var(--brand-accent); font-weight: 700; }

        /* Search Input */
        .search-container { margin-bottom: 30px; }
        input[type="text"] {
            background-color: #1E1E1E; border: 1px solid var(--border-color);
            color: white; padding: 12px 20px; border-radius: 8px; width: 200px; outline: none;
        }
        input[type="text"]:focus { border-color: var(--brand-accent); }
        button {
            background-color: var(--brand-accent); color: white; border: none;
            padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: 600;
        }
        button:hover { background-color: #009ACD; }

        /* Metric Box */
        .metric-box {
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            padding: 30px; border-radius: 20px; display: inline-block;
            margin-bottom: 30px; min-width: 200px;
        }
        .metric-label { font-size: 0.85em; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-secondary); }
        .metric-value { font-size: 3.5em; font-weight: 900; color: var(--brand-accent); margin: 15px 0 0 0; line-height: 1; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-card { background-color: var(--bg-card); border: 1px solid var(--border-color); padding: 15px; border-radius: 12px; }
        .stat-label { font-size: 0.75em; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 5px; }
        .stat-value { font-size: 1.1em; font-weight: 700; }

        /* Chart Container */
        .chart-container {
            width: 100%; border-radius: 16px; border: 1px solid var(--border-color);
            overflow: hidden; height: 500px; /* Fixed height for Plotly */
        }
        .footer { margin-top: 40px; font-size: 0.85em; color: var(--text-secondary); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Market Risks Overview</h1>

        <div class="search-container">
            <form id="search-form">
                <input type="text" id="ticker-input" placeholder="Enter Ticker (e.g. MSFT)" value="{{ ticker }}" required>
                <button type="submit">Analyse</button>
            </form>
        </div>

        <p class="subtitle">Annualised Volatility Analysis for <span class="highlight-blue">{{ ticker }}</span></p>

        <div class="metric-box" id="volatility-box" data-ticker="{{ ticker }}">
            <div class="metric-label">1-Year Risk Score (Vol)</div>
            <div class="metric-value" id="volatility-display">Loading...</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Sector</div>
                <div class="stat-value" id="stat-sector">...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Market Cap</div>
                <div class="stat-value" id="stat-market-cap">...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">P/E Ratio</div>
                <div class="stat-value" id="stat-pe">...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">52W High</div>
                <div class="stat-value" id="stat-high">...</div>
            </div>
        </div>

        <div class="chart-container" id="chart-box">
             </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
